<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista profesores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lista de profesores</h1>
    <section class="buscador">
       <p>Buscar: <input type="text"></p>
    </section>

    <form method="post" class="aniadidor">
            <h4>Agregar Profesor</h4>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">
            <label for="materia">Materia:</label>
            <input type="text" id="materia">
            <label for="aura">Aura:</label>
            <input type="text" id="aura"><br>
            <button type="submit" onclick="agregarProfe()">Añadir</button>
    </form>

    <section class="listadoDeProfes"></section>

    <script src="main.js"></script>
</body>
</html>
